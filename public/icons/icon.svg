<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0c0f14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2f163"/>
      <stop offset="100%" stop-color="#cbe034"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#e2f163" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#252e3e" stroke-width="6"/>

  <!-- Brand Symbol Container -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <rect width="300" height="300" rx="64" fill="url(#brand)"/>

    <!-- Bold FT Monogram -->
    <text x="150" y="205"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, sans-serif"
          font-size="140"
          font-weight="900"
          text-anchor="middle"
          fill="#0c0f14"
          letter-spacing="-6">FT</text>
  </g>
</svg>
